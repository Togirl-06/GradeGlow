<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>GradeGlow 3D anatomy</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: #e2e8f0; }
  #c { width: 100%; height: 100%; display: block; touch-action: none; }
  #panel { position: absolute; top: 8px; left: 8px; background: rgba(11, 18, 32, 0.82); border: 1px solid #23324a; border-radius: 8px; padding: 6px 8px; font-size: 12px; max-width: 46%; }
  #panel label { display: block; white-space: nowrap; cursor: pointer; }
  #panel button { margin-top: 4px; font-size: 12px; }
  #info { position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(11, 18, 32, 0.82); border-radius: 8px; padding: 6px 8px; font-size: 12px; min-height: 34px; }
  #name { color: #7dd3fc; font-weight: 800; font-size: 14px; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 20px; }
</style>
</head>
<body>
<canvas id="c" aria-label="3D anatomy model. Drag to rotate, pinch or scroll to zoom, tap a structure to select it."></canvas>
<div id="panel"><b>Layers</b><div id="systems"></div>
  <label><input type="checkbox" id="skin" checked /> Skin</label>
  <button id="reset" type="button">Reset view</button>
</div>
<div id="info"><div id="name">Tap a structure</div><div id="desc">Drag to rotate · pinch or scroll to zoom · patient’s left is on your right</div></div>
<div id="err">3D graphics (WebGL) are not available on this device. Use the list view in the lab instead.</div>
<script src="three.min.js"></script>
<script src="structures.js"></script>
<script src="anatomy3d.js"></script>
<script>
(function () {
  const A = GGAnatomy3D(THREE);
  const data = GG_ANATOMY;
  const canvas = document.getElementById('c');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (e) {
    document.getElementById('err').style.display = 'flex';
    send({ type: 'error', message: 'webgl' });
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const built = A.build(data);
  const scene = built.scene;
  scene.background = new THREE.Color(0x0b1220);
  scene.add(new THREE.HemisphereLight(0xdbe7ff, 0x3a2a20, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(1.5, 3, 2.5);
  scene.add(sun);
  const back = new THREE.DirectionalLight(0x9db4ff, 0.35);
  back.position.set(-2, 1, -2);
  scene.add(back);

  const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 50);
  const target = new THREE.Vector3(0, 1.05, 0);
  let yaw = 0, pitch = 0.05, dist = 1.9;
  function place() {
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    dist = Math.max(0.25, Math.min(4, dist));
    camera.position.set(target.x + dist * Math.sin(yaw) * Math.cos(pitch), target.y + dist * Math.sin(pitch), target.z + dist * Math.cos(yaw) * Math.cos(pitch));
    camera.lookAt(target);
  }
  function reset() { yaw = 0; pitch = 0.05; dist = 1.9; target.set(0, 1.05, 0); place(); }
  reset();

  // Layers.
  const visible = {};
  const box = document.getElementById('systems');
  Object.keys(data.systems).forEach(function (k) {
    visible[k] = true;
    const l = document.createElement('label');
    l.innerHTML = '<input type="checkbox" checked data-sys="' + k + '"> ' + data.systems[k];
    box.appendChild(l);
  });
  box.addEventListener('change', function (e) {
    const k = e.target.getAttribute('data-sys');
    if (!k) return;
    visible[k] = e.target.checked;
    applyLayers();
  });
  function applyLayers() {
    A.setSystems(built.groups, Object.keys(visible).filter(function (k) { return visible[k]; }));
  }
  document.getElementById('skin').addEventListener('change', function (e) { built.skin.visible = e.target.checked; });
  document.getElementById('reset').addEventListener('click', reset);

  // Selection and marks.
  const original = {};
  for (const id in built.groups) original[id] = built.groups[id].children[0].material.color.clone();
  let selected = null;
  const marks = {};
  function paint() {
    for (const id in built.groups) {
      const m = built.groups[id].children[0].material;
      const mark = marks[id];
      m.color.copy(original[id]);
      m.emissive.setHex(mark === 'correct' ? 0x1b5e20 : mark === 'wrong' ? 0x8b0000 : mark === 'target' ? 0x7a5c00 : id === selected ? 0x1d4ed8 : 0x000000);
    }
  }
  function select(id) {
    selected = id;
    paint();
    const g = id && built.groups[id];
    document.getElementById('name').textContent = g ? g.userData.name : 'Tap a structure';
    document.getElementById('desc').textContent = g ? g.userData.desc : '';
    if (g) send({ type: 'pick', id: id, name: g.userData.name });
  }

  // Orbit, zoom and tap.
  const pointers = {};
  let downAt = null, moved = 0, pinch = 0;
  canvas.addEventListener('pointerdown', function (e) { canvas.setPointerCapture(e.pointerId); pointers[e.pointerId] = { x: e.clientX, y: e.clientY }; downAt = { x: e.clientX, y: e.clientY }; moved = 0; });
  canvas.addEventListener('pointermove', function (e) {
    const p = pointers[e.pointerId];
    if (!p) return;
    const ids = Object.keys(pointers);
    if (ids.length === 2) {
      const a = pointers[ids[0]], b = pointers[ids[1]];
      const before = Math.hypot(a.x - b.x, a.y - b.y);
      p.x = e.clientX; p.y = e.clientY;
      const after = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinch) dist *= before / Math.max(after, 1);
      pinch = 1;
      moved += 10;
    } else {
      yaw -= (e.clientX - p.x) * 0.008;
      pitch += (e.clientY - p.y) * 0.008;
      moved += Math.abs(e.clientX - p.x) + Math.abs(e.clientY - p.y);
      p.x = e.clientX; p.y = e.clientY;
    }
    place();
  });
  function up(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = 0;
    if (downAt && moved < 6 && Object.keys(pointers).length === 0) {
      const r = canvas.getBoundingClientRect();
      const id = A.pickScreen(camera, ((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1, built.pickables);
      if (id) select(id);
    }
    downAt = null;
  }
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); dist *= Math.exp(e.deltaY * 0.001); place(); }, { passive: false });

  function resize() {
    const w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  (function loop() { requestAnimationFrame(loop); renderer.render(scene, camera); })();

  // Bridge to the app.
  function send(msg) {
    const json = JSON.stringify(msg);
    if (window.GGAnatomyChannel && window.GGAnatomyChannel.postMessage) window.GGAnatomyChannel.postMessage(json);
    else if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'gg-anatomy', data: json }, '*');
  }
  function command(c) {
    if (c.cmd === 'mark') { for (const k in marks) delete marks[k]; Object.assign(marks, c.marks || {}); paint(); }
    if (c.cmd === 'clear') { for (const k in marks) delete marks[k]; select(null); }
    if (c.cmd === 'focus' && built.groups[c.id]) { target.copy(A.centre(built.groups[c.id])); yaw = 0; pitch = 0.05; dist = 0.8; place(); select(c.id); }
    if (c.cmd === 'systems') { for (const k in visible) visible[k] = !c.list || c.list.indexOf(k) >= 0; box.querySelectorAll('input').forEach(function (i) { i.checked = visible[i.getAttribute('data-sys')]; }); applyLayers(); }
  }
  window.ggAnatomy = function (json) { command(typeof json === 'string' ? JSON.parse(json) : json); };
  window.addEventListener('message', function (e) {
    const d = e.data;
    if (d && d.source === 'gg-host') command(typeof d.data === 'string' ? JSON.parse(d.data) : d.data);
  });
  send({ type: 'ready' });
})();
</script>
</body>
</html>
