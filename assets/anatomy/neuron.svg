<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <title>Neuron</title>
  <rect width="400" height="300" fill="#0B1F33"/>
  <!-- Dendrites -->
  <g id="dendrites" stroke="#4DB6AC" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30 120 Q60 80 90 110 Q70 140 50 150"/>
    <path d="M40 160 Q55 130 80 150"/>
    <path d="M35 200 Q65 170 95 190"/>
  </g>
  <!-- Cell body -->
  <circle id="cell_body" cx="140" cy="150" r="42" fill="#7E57C2" stroke="#5E35B1" stroke-width="2"/>
  <!-- Myelin -->
  <g id="myelin" stroke="#E0E0E0" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M185 150 L280 150"/>
    <path d="M200 150 L260 150" stroke-width="8" stroke="#BDBDBD"/>
  </g>
  <!-- Axon -->
  <line id="axon" x1="182" y1="150" x2="300" y2="150" stroke="#FFB74D" stroke-width="5" stroke-linecap="round"/>
  <!-- Terminals -->
  <g id="terminal" fill="#81C784" stroke="#388E3C">
    <circle cx="320" cy="130" r="10"/>
    <circle cx="340" cy="155" r="10"/>
    <circle cx="325" cy="175" r="10"/>
    <circle cx="350" cy="140" r="8"/>
  </g>
</svg>
