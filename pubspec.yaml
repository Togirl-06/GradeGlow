name: ai_study_buddy
description: "GradeGlow — AI-powered study app with notes, flashcards, and tutoring."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  firebase_storage: ^12.4.5
  cloud_firestore: ^5.6.6
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  file_picker: ^9.2.1
  image_picker: ^1.1.2
  image: ^4.5.4
  http: ^1.4.0
  flutter_dotenv: ^5.2.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^4.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  video_thumbnail: ^0.5.3
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  audioplayers: ^6.7.0
  record: ^6.0.0
  read_pdf_text: ^0.3.1
  archive: ^4.0.9
  flutter_math_fork: ^0.7.4
  flutter_svg: ^2.0.17
  device_calendar: ^4.3.3
  url_launcher: ^6.3.2
  firebase_crashlytics: ^4.3.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/gradeglow_logo.png
  web:
    generate: true
    image_path: assets/images/gradeglow_logo.png
    background_color: "#FFFFFF"
    theme_color: "#F97316"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/gradeglow_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/gradeglow_logo.png
  android: true
  ios: true
  web: true

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/gradeglow_logo.png
    - assets/anatomy/
    - assets/biology/
    - assets/chemistry/
    - assets/physics/
    - assets/microbiology/
    - assets/sounds/
