name: CI

# Runs on every push and pull request. Results are written as check annotations
# and, for pushes to working branches, as a full plain-text report committed to
# the `ci-reports` branch (reports/<sha>.txt) so they can be read without the
# Actions log viewer.

on:
  push:
    branches-ignore: [ci-reports]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Flutter version
        run: flutter --version | tee -a ci_report.txt

      - name: Dependencies
        run: |
          echo "## flutter pub get" >> ci_report.txt
          flutter pub get 2>&1 | tail -30 | tee -a ci_report.txt
          (cd functions && npm ci --no-audit --no-fund 2>&1 | tail -5) | tee -a ci_report.txt

      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          echo "## flutter analyze" >> ci_report.txt
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.txt
          status=${PIPESTATUS[0]}
          grep -E "^\s*error" analyze.txt | head -200 >> ci_report.txt || true
          grep -cE "^\s*error" analyze.txt | sed 's/^/analyzer errors: /' >> ci_report.txt || true
          grep -cE "^\s*warning" analyze.txt | sed 's/^/analyzer warnings: /' >> ci_report.txt || true
          tail -3 analyze.txt >> ci_report.txt
          grep -E "^\s*error" analyze.txt | head -10 | while read -r l; do echo "::error::$l"; done || true
          exit $status

      - name: Flutter tests
        id: ftest
        continue-on-error: true
        run: |
          echo "## flutter test" >> ci_report.txt
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ftest.txt
          status=${PIPESTATUS[0]}
          grep -E "\[E\]|Some tests failed|All tests passed|Error:|Expected:|Actual:|Failed to load" ftest.txt | head -300 >> ci_report.txt || true
          tail -5 ftest.txt >> ci_report.txt
          grep -E "\[E\]" ftest.txt | head -10 | while read -r l; do echo "::error::$l"; done || true
          exit $status

      - name: Functions tests
        id: ntest
        continue-on-error: true
        run: |
          echo "## functions tests" >> ci_report.txt
          set -o pipefail
          (cd functions && node --test 'test/*.test.js' 2>&1) | tee ntest.txt
          status=${PIPESTATUS[0]}
          grep -E "^# (tests|pass|fail)|not ok" ntest.txt >> ci_report.txt || true
          exit $status

      - name: 3D world tests
        id: wtest
        continue-on-error: true
        run: |
          echo "## web/life_world tests" >> ci_report.txt
          set -o pipefail
          if [ -d web/life_world/test ]; then node --test 'web/life_world/test/*.test.mjs' 2>&1 | tee wtest.txt; status=${PIPESTATUS[0]}; grep -E "^# (tests|pass|fail)|not ok" wtest.txt >> ci_report.txt || true; else echo "none" >> ci_report.txt; status=0; fi
          exit $status

      - name: Summary
        run: |
          {
            echo "## outcome"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "flutter tests: ${{ steps.ftest.outcome }}"
            echo "functions tests: ${{ steps.ntest.outcome }}"
            echo "3D world tests: ${{ steps.wtest.outcome }}"
          } >> ci_report.txt
          cat ci_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::analyzer errors: $(grep -cE '^\s*error' analyze.txt || true); failing tests: $(grep -cE '\[E\]$' ftest.txt || true)"
          echo "::notice::analyze=${{ steps.analyze.outcome }} flutter=${{ steps.ftest.outcome }} functions=${{ steps.ntest.outcome }} world=${{ steps.wtest.outcome }}"

      - name: Publish report to ci-reports branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          mkdir -p /tmp/r && cp ci_report.txt /tmp/r/report.txt
          cp analyze.txt ftest.txt ntest.txt /tmp/r/ 2>/dev/null || true
          cp build/coding_problems.json /tmp/r/ 2>/dev/null || true
          cp pubspec.lock /tmp/r/pubspec.lock.txt 2>/dev/null || true
          git config user.name "gradeglow-ci"
          git config user.email "ci@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf /tmp/pub && mkdir /tmp/pub && cd /tmp/pub
            git init -q && git remote add origin "$(git -C "$GITHUB_WORKSPACE" remote get-url origin)"
            git -c http.extraheader="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)" fetch -q --depth=1 origin ci-reports && git checkout -q -B ci-reports FETCH_HEAD || git checkout -q --orphan ci-reports
            mkdir -p "reports/${GITHUB_SHA}" && cp /tmp/r/* "reports/${GITHUB_SHA}/"
            git add reports && git -c user.name=gradeglow-ci -c user.email=ci@users.noreply.github.com commit -qm "CI report ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            if git -c http.extraheader="$(git -C "$GITHUB_WORKSPACE" config --get http.https://github.com/.extraheader)" push -q origin ci-reports; then echo "published"; break; fi
            sleep $((attempt * 3))
          done

      - name: Fail if anything failed
        if: steps.analyze.outcome == 'failure' || steps.ftest.outcome == 'failure' || steps.ntest.outcome == 'failure' || steps.wtest.outcome == 'failure'
        run: exit 1
